name: Build VSuite Lab

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libarchive-tools
          sudo gem install --no-document fpm

      - name: Build
        shell: bash
        run: |
          chmod +x Build/build.sh || true
          chmod +x Build/pack-linux.sh || true
          chmod +x Build/pack-win.ps1 || true
          chmod +x Build/pack-macos.sh || true
          ./Build/build.sh ${{ matrix.rid }} "$VERSION"

      - name: List outputs
        shell: bash
        run: |
          echo "Generated files:"
          find . -type f \( \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.pkg" -o \
            -name "*.exe" -o \
            -name "*.zst" -o \
            -name "*.app" \
          \)

