name: Build VSuite Lab

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    
    
permissions:
  contents: write

jobs:
  # =========================
  # LINUX (deb/rpm/arch)
  # =========================
  linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install fpm dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libarchive-tools
          sudo gem install --no-document fpm

      - name: Build Linux app
        run: |
          chmod +x Build/build-linux.sh
          ./Build/build-linux.sh ${{ matrix.rid }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.rid }}
          path: |
            *.deb
            *.rpm
            *.pkg.tar.zst
  
  
  # =========================
  # WINDOWS (Inno Setup)
  # =========================
  windows:
    runs-on: windows-latest

    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Windows installer
        shell: pwsh
        run: |
          ./Build/build-win.ps1 ${{ matrix.rid }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rid }}
          path: |
            Build/Packaging/Output/*.exe
  
  
  # =========================
  # MACOS (.app + pkg)
  # =========================
  macos:
    runs-on: macos-latest

    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build macOS app
        run: |
          chmod +x Build/build-macos.sh
          ./Build/build-macos.sh ${{ matrix.rid }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: |
            *.pkg
            *.app
            
  release:
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
Build/Packaging/Output/*:
  exe: